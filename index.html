<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <title>raf Studio</title>

    <style>
        @font-face {
            font-family: 'NM_medium';
            src: url('./assets/fonts/NeueMontreal-Medium.otf');
        }

        @font-face {
            font-family: 'NM_bold';
            src: url('./assets/fonts/NeueMontreal-Bold.otf');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            list-style: none;
            letter-spacing: -0.5%;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'NM_medium';
            color: #101010;
        }

        header {
            position: fixed;
            z-index: 9;
            width: 100%;
            padding: 22px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-family: 'NM_bold';
        }

        nav {
            display: flex;
            gap: 64px;
            align-items: center;
            font-size: 18px;
        }

        nav>div {
            display: flex;
            gap: 16px;
            align-items: center;
            overflow: hidden;
        }

        .nav-L div:not(:nth-of-type(1)) {
            color: #BBB9B9;
        }

        .nav-R .lang {
            padding: 4px;
            display: flex;
            align-items: center;
            border: 1.5px solid #101010;
            gap: 4px;
        }

        .nav-R .lang .IN {
            color: #BBB9B9;
            font-size: 14px;
        }

        .nav-R .lang .SLASH {
            font-size: 16px;
        }

        .nav-R .lang .EN {
            font-size: 14px;
        }

        .menu {
            display: none;
            font-size: 18px;
        }

        main {

            display: flex;
            align-items: end;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        canvas.webgl {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: block;
            /* visibility: hidden; */
        }

        .bottom {
            display: flex;
            padding: 32px;
            flex-direction: column;
            gap: 48px;
            width: 100%;
        }

        .bottom .tagline {
            font-size: 64px;
            /* font-size: clamp(32px, calc(24px + 2.5vw), 64px); */
            line-height: 1;
            overflow: hidden;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: end;
            position: relative;
        }

        .bottom-bar a {
            font-family: 24px;
            padding: 2px 4px;
            display: flex;
            gap: 6px;
            border-bottom: 2px solid #101010;
            font-size: 24px;
            color: inherit;
            align-items: end;
        }

        .meta-org {
            display: inline-block;
            position: absolute;
            bottom: 0;
            color: #BBB9B9;
            left: 50%;
            transform: translateX(-50%);
        }

        .meta-scroll {
            font-size: 18px;
        }


        @media (max-width: 1000px) {
            .bottom .tagline {
                /* font-size: 32px; */
                font-size: clamp(28px, calc(11.059px + 5.294vw), 64px);
            }

            nav {
                display: none;
            }

            .menu {
                display: block;
            }

            .bottom {
                gap: 24px;
            }

            .meta-org {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            r.a.f. studio
        </div>
        <nav>
            <div class="nav-L">
                <div>Projects</div>
                <div>Practice</div>
                <div>Contact</div>
            </div>
            <div class="nav-R">
                <div class="lang">
                    <span class="EN">En</span><span class="SLASH">/</span><span class="IN">In</span>
                </div>
                <div class="cta">Get In Touch</div>
            </div>
        </nav>
        <div class="menu">Menu</div>
    </header>

    <main>
        <canvas class="webgl"></canvas>

        <div class="bottom">
            <div class="tagline">
                <p>
                    <span>We upcycle the context</span>
                    <br>
                    <span>
                    and provide solutions.
                    </span>
                </p>
            </div>
            <div class="bottom-bar">
                <a href="">
                    <span>View all projects</span>
                    <i class="ri-arrow-right-line"></i>
                </a>
                <span class="meta-org">
                    Rhizume Architectural Firms
                </span>
                <span class="meta-scroll">SCROLL</span>
            </div>
        </div>
    </main>

    <script type="module" src="./script.js"></script>
</body>

</html>
